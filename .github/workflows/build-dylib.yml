name: Build ApolloPatcher.dylib for Sideloadly

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build dylib (rootless)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS_PACKAGE_SCHEME: rootless
      FINALPACKAGE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Install dependencies
        run: brew install ldid dpkg make

      - name: Add GNU make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build tweak (rootless, arm64, iOS 15+)
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PACKAGE_SCHEME: rootless
          ARCHS: arm64
          TARGET: iphone:16.5:15.0

      - name: Extract ApolloPatcher.dylib from .deb
        id: extract
        run: |
          DEB_FILE=$(find . -name "*.deb" -type f | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb found!"
            exit 1
          fi
          echo "Found: $DEB_FILE"
          mkdir -p extract
          dpkg-deb -x "$DEB_FILE" extract
          DYLIB=$(find extract -name "ApolloPatcher.dylib" -type f | head -1)
          if [ -z "$DYLIB" ]; then
            echo "No dylib found in .deb!"
            exit 1
          fi
          echo "Found dylib: $DYLIB"
          mkdir -p output
          cp "$DYLIB" output/ApolloPatcher.dylib
          # Also copy control for version info
          dpkg-deb -e "$DEB_FILE" extract/DEBIAN
          cp extract/DEBIAN/control output/control.txt 2>/dev/null || true

      - name: Create Sideloadly injection script
        run: |
          cat > output/inject-sideloadly.sh << 'EOF'
          #!/bin/bash
          # Sideloadly Injection Helper for ApolloPatcher
          # Usage: ./inject-sideloadly.sh Apollo.ipa ApolloPatcher.dylib
          #
          # This script is for reference. Use Sideloadly GUI instead:
          # 1. Open Sideloadly.exe
          # 2. Select Apollo.ipa (from App Store)
          # 3. Drag ApolloPatcher.dylib into "Dylibs" section
          # 4. Enter Apple ID → Start
          #
          # Manual CLI alternative (if you have insert_dylib + ldid):
          # insert_dylib --inplace --all-yes "@executable_path/ApolloPatcher.dylib" Payload/Apollo.app/Apollo
          # ldid -S Payload/Apollo.app/Apollo
          echo "Use Sideloadly GUI: IPA + this dylib → Start"
          EOF
          chmod +x output/inject-sideloadly.sh

      - name: Zip dylib + script
        run: |
          cd output
          zip -r ../ApolloPatcher-dylib.zip .
          cd ..

      - name: Upload artifact (dylib for Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: ApolloPatcher-dylib
          path: ApolloPatcher-dylib.zip
          retention-days: 30

      - name: Create Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ApolloPatcher-dylib.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}